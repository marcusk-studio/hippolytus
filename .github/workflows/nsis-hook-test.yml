name: NSIS hook test
'on':
  push:
    branches:
      - claude/nsis-hook-test
jobs:
  migrate:
    name: 'perMachine 2.2.2 -> patched installer'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm via corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare --activate
      - name: Install frontend dependencies
        run: |
          cd apps/app
          pnpm install
      - name: Configure app environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env
      - name: Build app (produces NSIS installer with the patched hook)
        run: pnpm --filter=@modrinth/app run tauri build --bundles nsis
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

      - name: Locate built installer
        id: built
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path target -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) { Write-Host "no installer built"; exit 1 }
          Write-Host "built: $($exe.FullName)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install OLD 2.2.2 (perMachine)
        shell: pwsh
        run: |
          curl.exe -sSL -o old.exe "https://cdn.marcuskstudio.live/releases/2.2.2/windows-latest/release/bundle/nsis/MARCUSK%20Launcher_2.2.2_x64-setup.exe"
          $p = Start-Process -FilePath .\old.exe -ArgumentList '/S' -PassThru
          $null = $p.WaitForExit(300000)
          Write-Host "old exit: $($p.ExitCode)"
          Start-Sleep -Seconds 5
          Write-Host ("  ProgramFiles install : " + (Test-Path 'C:\Program Files\MARCUSK Launcher'))
          Write-Host ("  AllUsers StartMenu   : " + (Test-Path 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\MARCUSK Launcher.lnk'))

      - name: Run PATCHED installer over it (silent, like the updater does)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '${{ steps.built.outputs.path }}' -ArgumentList '/S' -PassThru
          $done = $p.WaitForExit(300000)
          if (-not $done) { Write-Host "!! TIMED OUT (blocking dialog during /S)"; $p.Kill() }
          else { Write-Host "patched installer exit: $($p.ExitCode)" }
          Start-Sleep -Seconds 5

      - name: Verdict
        shell: pwsh
        run: |
          $new = Test-Path "$env:LOCALAPPDATA\MARCUSK Launcher"
          $oldKey = $null
          Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -EA SilentlyContinue | ForEach-Object {
            if ((Get-ItemProperty $_.PSPath -EA SilentlyContinue).DisplayName -like '*MARCUSK*') { $oldKey = $true }
          }
          Write-Host ("  LocalAppData install : " + $new)
          Write-Host ("  old HKLM key remains : " + [bool]$oldKey)
          Write-Host ("  AllUsers StartMenu   : " + (Test-Path 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\MARCUSK Launcher.lnk'))
          if ($new -and -not $oldKey) { Write-Host "PASS: migrated to per-user, old registration gone" }
          elseif (-not $new) { Write-Host "FAIL: new install missing (regression!)"; exit 1 }
          else { Write-Host "PARTIAL: new installed but old registration remains"; }
