name: NSIS hook test
'on':
  push:
    branches:
      - claude/nsis-hook-verify
env:
  OLD_URL: 'https://cdn.marcuskstudio.live/releases/2.2.2/windows-latest/release/bundle/nsis/MARCUSK%20Launcher_2.2.2_x64-setup.exe'
  SHIPPED_URL: 'https://cdn.marcuskstudio.live/releases/2.4.0/windows-latest/release/bundle/nsis/MARCUSK%20Launcher_2.4.0_x64-setup.exe'
  LNK: 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\MARCUSK Launcher.lnk'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - shell: bash
        run: corepack enable && corepack prepare --activate
      - run: cd apps/app && pnpm install
      - shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env
      - run: pnpm --filter=@modrinth/app run tauri build --bundles nsis
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      - shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path target -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw "no installer built" }
          Copy-Item $exe.FullName patched-setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: patched-installer, path: patched-setup.exe }

  stale_shortcut:
    name: 'BUG 3: stale all-users shortcut, no registry (no UAC needed)'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { name: patched-installer }
      - shell: pwsh
        run: |
          function Reset-Env {
            Remove-Item "$env:LOCALAPPDATA\MARCUSK Launcher" -Recurse -Force -EA SilentlyContinue
            # a leftover all-users shortcut with NO uninstall registry entry
            $s = (New-Object -ComObject WScript.Shell).CreateShortcut($env:LNK)
            $s.TargetPath = 'C:\Windows\System32\notepad.exe'; $s.Save()
          }
          function Try-Install($exe, $label) {
            Reset-Env
            $p = Start-Process -FilePath $exe -ArgumentList '/S' -PassThru
            $done = $p.WaitForExit(180000)
            $code = if ($done) { $p.ExitCode } else { $p.Kill(); 'TIMEOUT' }
            $ok = Test-Path "$env:LOCALAPPDATA\MARCUSK Launcher\MARCUSK Launcher.exe"
            Write-Host "[$label] exit=$code installed=$ok"
            return $ok
          }
          curl.exe -sSL -o shipped.exe "$env:SHIPPED_URL"
          $shipped = Try-Install '.\shipped.exe' 'SHIPPED 2.4.0'
          $patched = Try-Install '.\patched-setup.exe' 'PATCHED'
          Write-Host ""
          if (-not $shipped -and $patched) { Write-Host "PASS: shipped installer is stuck by the stale shortcut; patched installs" }
          elseif ($shipped -and $patched) { Write-Host "INCONCLUSIVE: shipped also installed (bug not reproduced here)" }
          else { Write-Host "FAIL: patched installer did not install"; exit 1 }

  non_admin:
    name: 'BUG 2: silent install as a NON-ADMIN user (MessageBox blocks?)'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with: { name: patched-installer }
      - shell: pwsh
        run: |
          # old perMachine install => the hook's migration branch fires
          curl.exe -sSL -o old.exe "$env:OLD_URL"
          $p = Start-Process -FilePath .\old.exe -ArgumentList '/S' -PassThru
          $null = $p.WaitForExit(300000)
          Write-Host ("perMachine present: " + (Test-Path 'C:\Program Files\MARCUSK Launcher'))
          Write-Host ("all-users lnk     : " + (Test-Path $env:LNK))

          # a genuine standard (non-admin) user
          $pw = 'Str0ng!Pass' + (Get-Random)
          net user tuser $pw /add /y | Out-Null
          # explicitly NOT in Administrators
          $inAdmins = (net localgroup Administrators) -match 'tuser'
          Write-Host ("tuser is admin    : " + [bool]$inAdmins)
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential('tuser', $sec)

          function Run-AsUser($exe, $label) {
            Copy-Item $exe C:\Users\Public\run.exe -Force
            try {
              $p = Start-Process -FilePath C:\Users\Public\run.exe -ArgumentList '/S' -Credential $cred -PassThru -EA Stop
            } catch { Write-Host "[$label] could not launch as user: $($_.Exception.Message)"; return 'LAUNCHFAIL' }
            $done = $p.WaitForExit(120000)
            if (-not $done) { $p.Kill(); Write-Host "[$label] TIMED OUT -> blocked on a dialog during /S"; return 'TIMEOUT' }
            Write-Host "[$label] exit=$($p.ExitCode)"
            return "EXIT$($p.ExitCode)"
          }
          curl.exe -sSL -o shipped.exe "$env:SHIPPED_URL"
          $a = Run-AsUser '.\shipped.exe' 'SHIPPED 2.4.0 as non-admin'
          $b = Run-AsUser '.\patched-setup.exe' 'PATCHED as non-admin'
          Write-Host ""
          Write-Host "shipped=$a patched=$b"
          if ($a -eq 'TIMEOUT' -and $b -ne 'TIMEOUT') { Write-Host "PASS: shipped hangs on the MessageBox during /S; patched does not" }
          else { Write-Host "OBSERVED ONLY (see results above)" }
