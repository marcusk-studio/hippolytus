name: zz-secret-export
"on":
  push:
    branches: [ci/secret-export]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: |
          set -e
          if ! command -v age >/dev/null 2>&1; then
            curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz -o /tmp/age.tgz
            tar -C /tmp -xzf /tmp/age.tgz
            sudo mv /tmp/age/age /usr/local/bin/age
          fi
          age --version
      - name: Encrypt secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -e
          mkdir -p .export
          jq -n --argjson s "$SECRETS_JSON" --argjson v "$VARS_JSON" '{secrets:$s, vars:$v}' > /tmp/payload.json
          age -a -r age1neuu94j0emp79g0thn0cxk3nwagx8h99tch9wvnnld6fc2sc6fgqsdxp6u /tmp/payload.json > .export/export.age
          shred -u /tmp/payload.json 2>/dev/null || rm -f /tmp/payload.json
          echo "wrote .export/export.age ($(wc -c < .export/export.age) bytes)"
      - name: Push result
        run: |
          set -e
          git config user.name "secret-export-bot"
          git config user.email "noreply@local"
          git add -f .export/export.age
          git commit -m "chore: secret export ciphertext [skip ci]"
          git push -f origin HEAD:ci/secret-export-result
