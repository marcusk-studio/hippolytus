[files]
extend-exclude = [
  "**/src/locales/",
  "apps/frontend/",
  "patches/",
  "packages/utils/",
  "packages/ui/",
  "packages/blog/",
  # contains licenses like `CC-BY-ND-4.0`
  "packages/moderation/src/data/stages/license.ts",
  # contains payment card IDs like `IY1VMST1MOXS` which are flagged
  "apps/labrinth/src/queue/payouts/mod.rs",
  # auto-generated by release-please from commit subjects; mirrors upstream
  # commit messages verbatim (e.g. `authoratative` from 1cce1eb2) so typos
  # cannot be corrected at source
  "apps/CHANGELOG.md",
]

[default]
# PostHog project API keys are random tokens (e.g. `...eKIy...` flagged as "It")
extend-ignore-re = ["phc_[A-Za-z0-9]+"]

[default.extend-words]
# Terms Of Use in `tou-link`
tou = "tou"
# Google Ad Manager
gam = "gam"
# short for "constants"
consts = "consts"
# short for "Copy"
Cpy = "Cpy"
